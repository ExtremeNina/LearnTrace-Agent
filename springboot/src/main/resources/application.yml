spring:
  application:
    name: xueji-agent
  # 本地私密配置（git 忽略，密钥不进 git；存在时优先于环境变量）
  config:
    import: optional:file:./application-local.properties
  ai:
    openai:
      # DeepSeek 提供 OpenAI 兼容端点，统一经 Spring AI 接入（PRD §11）
      api-key: ***REMOVED***
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat
          temperature: 0.7
  data:
    redis:
      database: 1
      host: 127.0.0.1
      port: 6379
      password: ''
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: jdbc:mysql://localhost:3306/xueji?useUnicode=true&serverTimezone=Asia/Shanghai&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&autoReconnect=true&allowMultiQueries=true&useSSL=true
    username: root
    password: 123456
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver

sa-token:
  token-name: sa-token
  active-timeout: -1
  is-concurrent: true
  is-share: false
  is-log: false
  token-style: uuid

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    jdbc-type-for-null: 'null'

# 阿里云 OSS：密钥通过环境变量注入，禁止提交到 git（PRD §21）
ali-oss:
  endpoint: ${OSS_ENDPOINT:oss-cn-hangzhou.aliyuncs.com}
  accessKey: ${OSS_ACCESS_KEY:}
  secretKey: ${OSS_SECRET_KEY:}
  bucketName: ${OSS_BUCKET:jj-fruit-store}
  domain: ${OSS_DOMAIN:}

# 阿里云 OCR：与 OSS 使用同一账号密钥（同一环境变量）
aliyun:
  ocr:
    access-key: ${OSS_ACCESS_KEY:}
    secret-key: ${OSS_SECRET_KEY:}
    endpoint: ${OCR_ENDPOINT:ocr-api.cn-hangzhou.aliyuncs.com}

server:
  port: 9090
