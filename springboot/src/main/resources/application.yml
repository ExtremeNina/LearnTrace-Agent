spring:
  application:
    name: xueji-agent
  # 本地私密配置（git 忽略，密钥不进 git；存在时优先于环境变量）
  config:
    import: optional:file:./application-local.properties
  ai:
    openai:
      # DeepSeek 提供 OpenAI 兼容端点，统一经 Spring AI 接入（PRD §11）；密钥在本地私密配置注入，不入 git
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat
          temperature: 0.7
  data:
    redis:
      database: 1
      host: 127.0.0.1
      port: 6379
      password: ''
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
    # 发送可靠性：confirm / returns 回调生效的前提，漏配则 RabbitTemplate 回调静默失效
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
  servlet:
    multipart:
      # PRD §21：视频上限 500MB（图片大小由业务层另行校验）
      max-file-size: 1024MB
      max-request-size: 1044MB
  datasource:
    url: jdbc:mysql://localhost:3306/xueji?useUnicode=true&serverTimezone=Asia/Shanghai&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&autoReconnect=true&allowMultiQueries=true&useSSL=true
    username: root
    password: 123456
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver

sa-token:
  token-name: sa-token
  active-timeout: -1
  is-concurrent: true
  is-share: false
  is-log: false
  token-style: uuid

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    jdbc-type-for-null: 'null'

# 阿里云 OSS：密钥通过环境变量注入，禁止提交到 git（PRD §21）
ali-oss:
  endpoint: ${OSS_ENDPOINT:oss-cn-hangzhou.aliyuncs.com}
  accessKey: ${OSS_ACCESS_KEY:}
  secretKey: ${OSS_SECRET_KEY:}
  bucketName: ${OSS_BUCKET:jj-fruit-store}
  domain: ${OSS_DOMAIN:}

# 阿里云 OCR：与 OSS 使用同一账号密钥（同一环境变量）
aliyun:
  ocr:
    access-key: ${OSS_ACCESS_KEY:}
    secret-key: ${OSS_SECRET_KEY:}
    endpoint: ${OCR_ENDPOINT:ocr-api.cn-hangzhou.aliyuncs.com}

# 百度 PaddleOCR（AI Studio 星河社区，PaddleOCR-VL 异步任务服务）
paddle-ocr:
  api-base: ${PADDLE_OCR_BASE:https://paddleocr.aistudio-app.com/api/v2/ocr}
  token: ${PADDLE_OCR_TOKEN:}
  model: ${PADDLE_OCR_MODEL:PaddleOCR-VL-1.6}

# 阿里云百炼 Qwen-Audio 语音转写（网课流水线音频通道）
qwen:
  asr:
    api-key: ${QWEN_ASR_API_KEY:}
    base-url: ${QWEN_ASR_BASE_URL:https://ws-swm6f3vt0izc1plg.cn-beijing.maas.aliyuncs.com}
    model: ${QWEN_ASR_MODEL:qwen-audio-3.1-asr-flash}
    format: ${QWEN_ASR_FORMAT:wav}
    sample-rate: ${QWEN_ASR_SAMPLE_RATE:16000}

server:
  port: 9090
